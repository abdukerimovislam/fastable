name: fastable
description: "Fastable - Modern Fasting Tracker App"
publish_to: 'none'

version: 1.0.1+16

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- CORE & ARCHITECTURE ---
  intl: ^0.20.2
  get_it: ^7.6.7                # Dependency Injection
  injectable: ^2.3.2            # Code gen for DI
  flutter_bloc: ^8.1.3          # State Management
  equatable: ^2.0.5             # Value equality
  rxdart: ^0.27.7               # Reactive programming
  logger: ^2.0.2                # Nice logging
  uuid: ^4.3.3                  # Unique IDs
  shared_preferences: ^2.2.3

  # --- FIREBASE & BACKEND ---
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.2
  firebase_auth: ^5.7.0
  firebase_crashlytics: ^4.1.4
  google_sign_in: ^6.2.1

  # --- UI & UX ---
  cupertino_icons: ^1.0.8
  percent_indicator: ^4.2.5
  curved_navigation_bar: ^1.0.3
  table_calendar: ^3.1.2
  fl_chart: ^1.2.0             # Updated version for stability
  flutter_staggered_animations: ^1.1.1
  google_mobile_ads: ^5.1.0
  flutter_launcher_icons: ^0.13.1

  glassmorphism: ^3.0.0         # For glass cards

  # --- FEATURES ---
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.4
  audioplayers: ^6.0.0
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  sunrise_sunset_calc: ^3.0.0
  url_launcher: ^6.2.5
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # --- NEW TOP TIER FEATURES ---
  health: ^13.1.4               # Apple Health & Google Health Connect
  purchases_flutter: ^9.11.0    # RevenueCat (Subscriptions)
  google_generative_ai: ^0.4.7
  flutter_markdown: ^0.7.7+1
  sign_in_with_apple: ^7.0.1
  firebase_remote_config: ^5.5.0
  purchases_ui_flutter: ^9.11.0
  upgrader: ^12.5.0
  flutter_timezone: ^5.0.2
  live_activities: ^2.4.7
  flutter_dotenv: ^6.0.0
  google_fonts: ^8.0.2
  flutter_staggered_grid_view: ^0.7.0

  # --- PDF REPORTS ---
  pdf: ^3.11.1
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  bloc_test: ^9.1.0
  mocktail: ^1.0.0

  # --- CODE GENERATION ---
  build_runner: ^2.4.8
  injectable_generator: ^2.5.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/sounds/
    - assets/icon/
    - .env

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon/icon.png"

